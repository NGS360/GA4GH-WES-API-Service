# Workspace root. Deliberately not a package itself -- there is no [project]
# table here, so nothing is built or published from the repo root.
#
# The three distributions under packages/ are peers:
#
#   wes-schemas   the wire contract, pydantic and nothing else
#   wes-service   the server, depends on wes-schemas
#   wes-client    the client and CLI, depends on wes-schemas
#
# Dependency edges run schemas <- server and schemas <- client. The server does
# not depend on the client at runtime; it dev-depends on it so the contract tests
# can drive the client against the real app.
#
# Keeping them in one repo means a contract change and its client land in a single
# commit and are tested together. Keeping them as separate distributions means a
# consumer installs only what it needs: NGS360 APIServer takes wes-client, which
# pulls httpx and pydantic, not the server's database and AWS stack.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wes-schemas = { workspace = true }
wes-client = { workspace = true }
wes-service = { workspace = true }

# Test configuration lives at the root so `uv run pytest` runs everything from
# one place, which is also what CI does. The suites themselves belong to the
# packages that own them.
[tool.pytest.ini_options]
testpaths = ["packages/wes-service/tests"]
asyncio_mode = "auto"
addopts = "-v --cov=packages/wes-service/src --cov=packages/wes-client/src --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["packages/wes-service/src", "packages/wes-client/src"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
