[project]
name = "wes-client"
version = "1.1.0"
description = "Client library and CLI for the GA4GH Workflow Execution Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ryan Golhar", email = "ryan.golhar@bms.com" },
    { name = "Maggie Chen", email = "yu.chen2@bms.com" },
]

# Floor is 3.12 to match the server, not 3.13, so the client stays installable
# by every consumer -- NGS360 APIServer runs 3.13, but a library should not
# impose the highest floor among its consumers.
dependencies = [
    "httpx>=0.28.1",
    "wes-schemas",
]

[project.optional-dependencies]
# The CLI's presentation dependencies are an extra so that a service importing
# this as a library does not install a terminal formatting stack it will never
# render anything with.
cli = [
    "typer>=0.20.0",
    "rich>=14.0.0",
]

[project.scripts]
wes = "wes_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wes_client"]

[tool.uv.sources]
wes-schemas = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
