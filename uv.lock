    { name = "aiomysql" },
    { name = "aiosqlite" },
    { name = "alembic" },
    { name = "boto3" },
    { name = "cachetools" },
    { name = "fastapi" },
    { name = "flake8" },
    { name = "greenlet" },
    { name = "httpx" },
    { name = "passlib", extra = ["bcrypt"] },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "python-dotenv" },
    { name = "python-jose", extra = ["cryptography"] },
    { name = "python-multipart" },
    { name = "requests" },
    { name = "sqlalchemy" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
dev = [
    { name = "faker" },
    { name = "httpx" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pytest-mock" },
]

[package.metadata]
requires-dist = [
    { name = "aiofiles", specifier = ">=25.1.0" },
    { name = "aiomysql", specifier = ">=0.3.2" },
    { name = "aiosqlite", specifier = ">=0.22.1" },
    { name = "alembic", specifier = ">=1.18.5" },
    { name = "boto3", specifier = ">=1.43.14" },
    { name = "cachetools", specifier = ">=7.1.4" },
    { name = "faker", marker = "extra == 'dev'", specifier = ">=40.28.1" },
    { name = "fastapi", specifier = ">=0.139.0" },
    { name = "flake8", specifier = ">=7.3.0" },
    { name = "greenlet", specifier = ">=3.5.0" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "httpx", marker = "extra == 'dev'", specifier = ">=0.28.1" },
    { name = "passlib", extras = ["bcrypt"], specifier = ">=1.7.4" },
    { name = "pydantic", specifier = ">=2.13.4" },
    { name = "pydantic-settings", specifier = ">=2.14.1" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=9.1.1" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=1.4.0" },
    { name = "pytest-cov", marker = "extra == 'dev'", specifier = ">=7.1.0" },
    { name = "pytest-mock", marker = "extra == 'dev'", specifier = ">=3.15.1" },
    { name = "python-dotenv", specifier = ">=1.2.2" },
    { name = "python-jose", extras = ["cryptography"], specifier = ">=3.5.0" },
    { name = "python-multipart", specifier = ">=0.0.32" },
    { name = "requests", specifier = ">=2.33.1" },
    { name = "sqlalchemy", specifier = ">=2.0.51" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.51.0" },
]
provides-extras = ["dev"]
